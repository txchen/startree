name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '22'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run test
      - run: vp run build
      - run: vp run verify:migrations
      - run: vp run verify:config
      - run: vp run verify:local
