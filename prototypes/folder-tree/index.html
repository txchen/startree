<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarTree folder-tree prototype</title>
    <!-- Three variants of the Bookmarks Page, switchable via ?variant=, on a throwaway prototype route. -->
    <style>
      :root {
        color-scheme: light;
        --ink: #17211b;
        --muted: #6c766f;
        --line: #dfe5df;
        --surface: #ffffff;
        --canvas: #f4f6f2;
        --accent: #176b45;
        --accent-soft: #dff3e7;
        --danger: #a13d32;
        --shadow: 0 12px 36px rgb(25 42 31 / 10%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--canvas); }
      button, input, textarea { font: inherit; }
      button { color: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 3px solid rgb(45 125 86 / 25%);
        outline-offset: 2px;
      }
      svg { width: 1.05rem; height: 1.05rem; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .prototype-shell { min-height: 100vh; padding-bottom: 92px; }
      .app { min-height: 100vh; display: grid; }
      .drawer-scrim { display: none; }
      .sidebar { position: relative; z-index: 4; overflow: auto; }
      .main { min-width: 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.03em; }
      .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--accent); color: white; }
      .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(25px, 3vw, 38px); line-height: 1.08; letter-spacing: -.045em; }
      h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .icon-button, .quiet-button, .primary-button, .mode-button, .tree-row, .page-tab, .search-button, .card-action, .variant-button {
        border: 0; cursor: pointer;
      }
      .icon-button { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: transparent; }
      .icon-button:hover { background: rgb(23 107 69 / 8%); }
      .primary-button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: 12px; color: white; background: var(--accent); font-weight: 700; box-shadow: 0 6px 16px rgb(23 107 69 / 18%); }
      .quiet-button { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 12px; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 650; }
      .quiet-button:hover { background: rgb(0 0 0 / 5%); color: var(--ink); }
      .danger-button { color: var(--danger); }
      .mobile-menu { display: none; }
      .tree-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
      .tree-list { display: grid; gap: 3px; margin-top: 8px; }
      .tree-row { width: 100%; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 7px; min-height: 36px; padding: 0 10px; border-radius: 10px; background: transparent; color: var(--muted); text-align: left; }
      .tree-row:hover { color: var(--ink); background: rgb(23 107 69 / 6%); }
      .tree-row.active { color: var(--accent); background: var(--accent-soft); font-weight: 720; }
      .tree-row .count { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .7; }
      .tree-row.depth-1 { padding-left: 28px; }
      .tree-row.depth-2 { padding-left: 46px; }
      .sidebar-footer { margin-top: auto; }
      .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; color: var(--muted); font-size: 13px; }
      .breadcrumbs b { color: var(--ink); }
      .content-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      .content-actions { display: flex; align-items: center; gap: 8px; }
      .section-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .section-label span { color: var(--muted); font-size: 12px; }
      .folder-grid, .bookmark-grid { display: grid; gap: 12px; }
      .folder-card, .bookmark-card { position: relative; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
      .folder-card:hover, .bookmark-card:hover { transform: translateY(-2px); border-color: #b7c8ba; box-shadow: var(--shadow); }
      .folder-card { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 14px; border-radius: 16px; }
      .folder-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #eef1e8; color: #6a724a; }
      .folder-card strong, .bookmark-card strong { display: block; letter-spacing: -.015em; }
      .folder-card small, .bookmark-card small { color: var(--muted); }
      .bookmark-card { min-height: 172px; padding: 17px; border-radius: 18px; overflow: hidden; }
      .bookmark-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
      .site-mark { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--site, #e8efe9); color: #25362c; font-weight: 820; text-transform: uppercase; }
      .bookmark-copy { margin-top: 22px; }
      .bookmark-copy small { display: block; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .note { margin-top: 13px; color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; }
      .tag { padding: 4px 7px; border-radius: 999px; background: #f0f3f0; color: #5f6b63; font-size: 10px; font-weight: 700; }
      .drag-handle { display: none; color: var(--muted); cursor: grab; }
      .edit-mode .drag-handle { display: inline-grid; }
      .edit-mode .bookmark-card, .edit-mode .folder-card { border-style: dashed; }
      .edit-ribbon { display: none; }
      .edit-mode .edit-ribbon { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; color: #704c00; background: #fff1c7; font-size: 12px; font-weight: 720; }
      .empty-state { display: grid; place-items: center; min-height: 280px; padding: 40px; border: 1px dashed #bac5bc; border-radius: 20px; text-align: center; }
      .empty-state .folder-icon { margin-bottom: 14px; }
      .empty-state p { max-width: 380px; margin: 8px auto 18px; color: var(--muted); line-height: 1.5; }

      /* Variant A: familiar library. */
      .variant-a { grid-template-columns: 264px 1fr; background: #f6f7f4; }
      .variant-a .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); background: #fbfcfa; }
      .variant-a .page-tabs { display: flex; margin: 28px 0 25px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
      .variant-a .page-tab { padding: 8px 10px; border-radius: 9px; color: var(--accent); background: var(--accent-soft); font-weight: 720; }
      .variant-a .sidebar-footer { padding-top: 22px; }
      .variant-a .main-header { display: flex; align-items: center; gap: 18px; min-height: 76px; padding: 14px 34px; border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 80%); backdrop-filter: blur(18px); }
      .variant-a .search-button { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 13px; color: var(--muted); background: white; text-align: left; }
      .variant-a .search-button kbd { margin-left: auto; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px; background: #f6f7f5; font-size: 11px; }
      .variant-a .header-spacer { flex: 1; }
      .variant-a .content { padding: 30px 34px 60px; }
      .variant-a .content-heading { margin: 12px 0 30px; }
      .variant-a .content-section + .content-section { margin-top: 31px; }
      .variant-a .folder-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
      .variant-a .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); }

      /* Variant B: information-rich workbench. */
      .variant-b { grid-template-columns: 330px 1fr; background: #e9e6df; }
      .variant-b .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 24px; color: #f5f0e6; background: #202c28; }
      .variant-b .brand-mark { color: #1f332a; background: #d8ff80; }
      .variant-b .page-tabs { margin: 28px 0; }
      .variant-b .page-tab { width: 100%; padding: 13px; border-radius: 12px; color: #1f332a; background: #d8ff80; font-weight: 800; text-align: left; }
      .variant-b .tree-heading, .variant-b .tree-row { color: #aebbb4; }
      .variant-b .tree-row:hover { color: white; background: rgb(255 255 255 / 8%); }
      .variant-b .tree-row.active { color: white; background: rgb(216 255 128 / 14%); }
      .variant-b .sidebar-footer .quiet-button { color: #b7c1bc; }
      .variant-b .main { padding: 20px; }
      .variant-b .main-frame { min-height: calc(100vh - 40px); border-radius: 24px; overflow: hidden; background: #f9f6ef; box-shadow: 0 18px 55px rgb(31 38 34 / 15%); }
      .variant-b .main-header { display: grid; grid-template-columns: auto minmax(240px, 1fr) auto; gap: 16px; align-items: center; padding: 18px 24px; border-bottom: 1px solid #dfd9cd; }
      .variant-b .search-button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 15px; border: 0; border-radius: 999px; color: #70766f; background: #e9e5dc; text-align: left; }
      .variant-b .search-button kbd { display: none; }
      .variant-b .header-spacer { display: none; }
      .variant-b .content { padding: 28px 30px 60px; }
      .variant-b .content-heading { align-items: center; margin: 12px 0 28px; padding-bottom: 24px; border-bottom: 1px solid #dfd9cd; }
      .variant-b h1 { font-family: Georgia, serif; font-weight: 500; }
      .variant-b .content-section + .content-section { margin-top: 28px; }
      .variant-b .folder-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .variant-b .folder-card { min-height: 86px; border-color: #ded8cc; border-radius: 8px; box-shadow: 4px 4px 0 #d7d1c4; }
      .variant-b .bookmark-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
      .variant-b .bookmark-card { min-height: 154px; border: 0; border-radius: 7px; box-shadow: inset 0 0 0 1px #ded8cc; }
      .variant-b .bookmark-copy { margin-top: 13px; padding-left: 50px; }
      .variant-b .note { padding-left: 50px; }
      .variant-b .tags { padding-left: 50px; }

      /* Variant C: compact launchpad. */
      .variant-c { grid-template-columns: 212px 1fr; color: #eef2ff; background: #101223; }
      .variant-c .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 18px 12px; border-right: 1px solid #292d49; background: #15182c; }
      .variant-c .brand { padding: 0 8px; }
      .variant-c .brand-mark { background: linear-gradient(135deg, #8a7dff, #48d8bb); }
      .variant-c .page-tabs { margin: 20px 0 18px; }
      .variant-c .page-tab { width: 100%; padding: 10px; border-radius: 10px; color: #fff; background: #2b3152; font-weight: 720; text-align: left; }
      .variant-c .tree-heading, .variant-c .tree-row { color: #9299bc; }
      .variant-c .tree-row { min-height: 32px; border-radius: 7px; }
      .variant-c .tree-row:hover { color: white; background: #232741; }
      .variant-c .tree-row.active { color: white; background: #353c65; }
      .variant-c .sidebar-footer .quiet-button { color: #8f96b9; }
      .variant-c .main-header { display: flex; align-items: center; gap: 14px; padding: 20px 28px 8px; }
      .variant-c .search-button { order: 2; flex: 0 1 640px; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border: 1px solid #383e63; border-radius: 14px; color: #949cbd; background: #1a1e36; text-align: left; box-shadow: inset 0 1px rgb(255 255 255 / 4%); }
      .variant-c .search-button kbd { margin-left: auto; padding: 3px 7px; border: 1px solid #454b70; border-radius: 6px; font-size: 10px; }
      .variant-c .header-spacer { order: 1; flex: 1; }
      .variant-c .main-header .content-actions { order: 3; }
      .variant-c .primary-button { background: #746cf2; }
      .variant-c .quiet-button { color: #a4abc9; }
      .variant-c .content { padding: 22px 28px 60px; }
      .variant-c .breadcrumbs, .variant-c .muted, .variant-c .section-label span { color: #858dac; }
      .variant-c .breadcrumbs b { color: #eef2ff; }
      .variant-c .content-heading { margin: 8px 0 27px; }
      .variant-c .content-section + .content-section { margin-top: 28px; }
      .variant-c .folder-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
      .variant-c .folder-card { min-height: 62px; padding: 10px; border-color: #2c3150; border-radius: 12px; background: #191d34; }
      .variant-c .folder-icon { width: 36px; height: 36px; border-radius: 10px; color: #c4c8ff; background: #2c3150; }
      .variant-c .folder-card small, .variant-c .bookmark-card small { color: #858dac; }
      .variant-c .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .variant-c .bookmark-card { min-height: 142px; padding: 14px; border-color: #2c3150; border-radius: 13px; background: #191d34; }
      .variant-c .bookmark-copy { margin-top: 16px; }
      .variant-c .note { display: none; }
      .variant-c .tag { color: #b4b9da; background: #292e4c; }
      .variant-c .site-mark { color: white; background: var(--site, #363c62); }

      .overlay { position: fixed; z-index: 20; inset: 0; display: none; place-items: start center; padding: 11vh 20px 20px; background: rgb(11 18 14 / 46%); backdrop-filter: blur(7px); }
      .overlay.open { display: grid; }
      .dialog { width: min(660px, 100%); max-height: 76vh; overflow: auto; border-radius: 22px; background: white; box-shadow: 0 25px 80px rgb(0 0 0 / 24%); }
      .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--line); }
      .dialog-body { padding: 22px; }
      .search-input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 13px; font-size: 18px; }
      .search-results { display: grid; gap: 6px; margin-top: 16px; }
      .search-result { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 11px; border-radius: 12px; }
      .search-result:hover { background: #f2f5f2; }
      .result-type { color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; }
      .field { display: grid; gap: 7px; margin-bottom: 16px; }
      .field label { font-size: 12px; font-weight: 750; }
      .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fbfcfb; }
      .field textarea { min-height: 90px; resize: vertical; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .toast { position: fixed; z-index: 30; left: 50%; bottom: 92px; display: none; align-items: center; gap: 18px; padding: 12px 15px; border-radius: 12px; color: white; background: #202823; box-shadow: var(--shadow); transform: translateX(-50%); }
      .toast.show { display: flex; }
      .toast button { border: 0; color: #a8f0c8; background: transparent; cursor: pointer; font-weight: 750; }
      .prototype-switcher { position: fixed; z-index: 50; left: 50%; bottom: 20px; display: grid; grid-template-columns: 38px minmax(180px, auto) 38px; align-items: center; padding: 5px; border-radius: 999px; color: white; background: #090c0a; box-shadow: 0 12px 34px rgb(0 0 0 / 28%); transform: translateX(-50%); }
      .variant-button { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: white; background: transparent; font-size: 19px; }
      .variant-button:hover { background: #262b27; }
      .variant-label { padding: 0 14px; font-size: 12px; font-weight: 740; text-align: center; }
      .state-panel { position: fixed; z-index: 40; right: 16px; bottom: 16px; width: min(260px, calc(100vw - 32px)); border: 1px solid #333b35; border-radius: 12px; color: #e8eee9; background: #111713; box-shadow: var(--shadow); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .state-panel summary { padding: 9px 11px; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 720; }
      .state-panel pre { margin: 0; padding: 0 11px 11px; max-height: 180px; overflow: auto; white-space: pre-wrap; }

      @media (max-width: 760px) {
        .app, .variant-a, .variant-b, .variant-c { display: block; }
        .sidebar { position: fixed; z-index: 15; inset: 0 auto 0 0; width: min(310px, 86vw); min-height: 100vh; box-shadow: 20px 0 60px rgb(0 0 0 / 20%); transform: translateX(-105%); transition: transform .2s ease; }
        .drawer-open .sidebar { transform: translateX(0); }
        .drawer-scrim { position: fixed; z-index: 14; inset: 0; display: none; background: rgb(0 0 0 / 34%); }
        .drawer-open .drawer-scrim { display: block; }
        .main, .variant-b .main { padding: 0; }
        .variant-b .main-frame { min-height: 100vh; border-radius: 0; }
        .main-header, .variant-a .main-header, .variant-b .main-header, .variant-c .main-header { position: sticky; z-index: 8; top: 0; display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; min-height: 66px; padding: 10px 14px; background: rgb(250 251 248 / 92%); backdrop-filter: blur(16px); }
        .variant-c .main-header { background: rgb(16 18 35 / 92%); }
        .mobile-menu { display: inline-grid; }
        .search-button, .variant-a .search-button, .variant-b .search-button, .variant-c .search-button { order: initial; min-width: 0; height: 42px; min-height: 42px; }
        .search-button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-button kbd { display: none; }
        .header-spacer { display: none !important; }
        .main-header .content-actions { order: initial; }
        .main-header .mode-button { display: none; }
        .primary-button { width: 40px; padding: 0; justify-content: center; }
        .primary-button span { display: none; }
        .content, .variant-a .content, .variant-b .content, .variant-c .content { padding: 20px 16px 70px; }
        .content-heading { align-items: start; margin-top: 4px !important; }
        .content-heading .content-actions { display: none; }
        .folder-grid, .variant-a .folder-grid, .variant-b .folder-grid, .variant-c .folder-grid { grid-template-columns: 1fr 1fr; }
        .bookmark-grid, .variant-a .bookmark-grid, .variant-b .bookmark-grid, .variant-c .bookmark-grid { grid-template-columns: 1fr 1fr; }
        .bookmark-card { min-height: 150px; }
        .variant-b .bookmark-copy, .variant-b .note, .variant-b .tags { padding-left: 0; }
        .note { display: none; }
        .state-panel { display: none; }
      }

      @media (max-width: 470px) {
        .folder-grid, .variant-a .folder-grid, .variant-b .folder-grid, .variant-c .folder-grid { grid-template-columns: 1fr; }
        .bookmark-grid, .variant-a .bookmark-grid, .variant-b .bookmark-grid, .variant-c .bookmark-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
        .bookmark-card { min-height: 132px; padding: 12px; }
        .bookmark-copy { margin-top: 14px; }
        .tags { display: none; }
        .prototype-switcher { bottom: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const variants = {
        A: { name: "Quiet library", className: "variant-a" },
        B: { name: "Editorial workbench", className: "variant-b" },
        C: { name: "Compact launchpad", className: "variant-c" },
      };

      const folders = [
        { id: "root", name: "All bookmarks", parent: null, count: 17 },
        { id: "work", name: "Work", parent: "root", count: 8 },
        { id: "engineering", name: "Engineering", parent: "work", count: 5 },
        { id: "research", name: "Research", parent: "work", count: 3 },
        { id: "personal", name: "Personal", parent: "root", count: 6 },
        { id: "reading", name: "Reading list", parent: "personal", count: 4 },
        { id: "travel", name: "Travel", parent: "personal", count: 2 },
        { id: "inspiration", name: "Inspiration", parent: "root", count: 3 },
      ];

      const bookmarks = [
        { id: "b1", folder: "engineering", title: "Cloudflare Developers", url: "developers.cloudflare.com", note: "Workers, D1, and platform references.", tags: ["cloudflare", "reference"], color: "#ffd879" },
        { id: "b2", folder: "engineering", title: "GitHub", url: "github.com", note: "Repositories, issues, and release work.", tags: ["code", "work"], color: "#d8dce2" },
        { id: "b3", folder: "engineering", title: "MDN Web Docs", url: "developer.mozilla.org", note: "The browser platform, without the fluff.", tags: ["reference", "web"], color: "#c9ddff" },
        { id: "b4", folder: "engineering", title: "Linear", url: "linear.app", note: "Planning and issue triage.", tags: ["planning", "work"], color: "#d7d0ff" },
        { id: "b5", folder: "engineering", title: "Observable", url: "observablehq.com", note: "Data sketches and interactive notebooks.", tags: ["data", "tools"], color: "#d1f1df" },
        { id: "b6", folder: "research", title: "Are.na", url: "are.na", note: "Loose threads and visual research.", tags: ["ideas"], color: "#e7e4dc" },
        { id: "b7", folder: "reading", title: "The Marginalian", url: "themarginalian.org", note: "Long reads saved for quiet weekends.", tags: ["reading"], color: "#ffd3c6" },
      ];

      const trash = [
        { id: "t1", type: "Folder", title: "Old project", detail: "3 bookmarks · deleted 2 days ago" },
        { id: "t2", type: "Bookmark", title: "Deployment checklist", detail: "deleted 6 days ago" },
      ];

      const query = new URLSearchParams(location.search);
      const initialVariant = variants[query.get("variant")] ? query.get("variant") : "A";
      const state = {
        variant: initialVariant,
        selectedFolder: "engineering",
        mode: "browse",
        overlay: null,
        drawerOpen: false,
        search: "",
        toast: null,
      };

      const icons = {
        tree: `<svg viewBox="0 0 24 24"><path d="M4 4h6l2 3h8v12H4z"/><path d="M4 9h16"/></svg>`,
        search: `<svg viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.7"/><path d="m16 16 4 4"/></svg>`,
        plus: `<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.4-10.4-3.2-3.2L5 15.8zM13.8 7l3.2 3.2"/></svg>`,
        menu: `<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
        trash: `<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>`,
        grip: `<svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="1"/><circle cx="16" cy="7" r="1"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="8" cy="17" r="1"/><circle cx="16" cy="17" r="1"/></svg>`,
        more: `<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>`,
        close: `<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>`,
        folder: `<svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10H3z"/></svg>`,
      };

      function folderById(id) { return folders.find((folder) => folder.id === id); }
      function currentFolder() { return folderById(state.selectedFolder) || folders[0]; }
      function childrenOf(id) { return folders.filter((folder) => folder.parent === id); }
      function bookmarksOf(id) { return bookmarks.filter((bookmark) => bookmark.folder === id); }
      function isMobile() { return matchMedia("(max-width: 760px)").matches; }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]); }

      function treeRows() {
        const order = [
          ["root", 0], ["work", 0], ["engineering", 1], ["research", 1],
          ["personal", 0], ["reading", 1], ["travel", 1], ["inspiration", 0],
        ];
        return order.map(([id, depth]) => {
          const folder = folderById(id);
          return `<button class="tree-row depth-${depth} ${state.selectedFolder === id ? "active" : ""}" data-action="select-folder" data-id="${id}">
            ${icons.folder}<span>${escapeHtml(folder.name)}</span><span class="count">${folder.count}</span>
          </button>`;
        }).join("");
      }

      function sidebar() {
        return `<aside class="sidebar">
          <div class="brand"><span class="brand-mark">✦</span><span>StarTree</span></div>
          <div class="page-tabs"><button class="page-tab">Bookmarks</button></div>
          <div class="tree-heading"><span class="eyebrow">Folders</span><button class="icon-button" data-action="new-folder" aria-label="New folder">${icons.plus}</button></div>
          <nav class="tree-list" aria-label="Folder tree">${treeRows()}</nav>
          <div class="sidebar-footer">
            <button class="quiet-button ${state.selectedFolder === "trash" ? "active" : ""}" data-action="select-trash">${icons.trash}<span>Trash</span><small>2</small></button>
          </div>
        </aside>`;
      }

      function header() {
        return `<header class="main-header">
          <button class="icon-button mobile-menu" data-action="toggle-drawer" aria-label="Open folders">${icons.menu}</button>
          <button class="search-button" data-action="open-search">${icons.search}<span>Search bookmarks, tags, notes…</span><kbd>⌘ K</kbd></button>
          <span class="header-spacer"></span>
          <div class="content-actions">
            <button class="quiet-button mode-button" data-action="toggle-edit">${state.mode === "edit" ? "Done" : `${icons.edit}<span>Edit</span>`}</button>
            <button class="primary-button" data-action="new-bookmark">${icons.plus}<span>Add</span></button>
          </div>
        </header>`;
      }

      function breadcrumb() {
        const folder = currentFolder();
        const parts = folder.id === "engineering" ? ["Bookmarks", "Work", "Engineering"] : ["Bookmarks", folder.name];
        return parts.map((part, index) => index === parts.length - 1 ? `<b>${escapeHtml(part)}</b>` : `<span>${escapeHtml(part)} ›</span>`).join("");
      }

      function folderCards(items) {
        return items.map((folder) => `<article class="folder-card" data-action="select-folder" data-id="${folder.id}">
          <span class="drag-handle">${icons.grip}</span><span class="folder-icon">${icons.folder}</span>
          <span><strong>${escapeHtml(folder.name)}</strong><small>${folder.count} bookmarks</small></span>
        </article>`).join("");
      }

      function bookmarkCards(items) {
        return items.map((bookmark) => `<article class="bookmark-card" data-action="${state.mode === "edit" ? "edit-bookmark" : "open-bookmark"}" data-id="${bookmark.id}">
          <div class="bookmark-top"><span class="site-mark" style="--site:${bookmark.color}">${escapeHtml(bookmark.title[0])}</span>
            <span>${state.mode === "edit" ? `<span class="drag-handle">${icons.grip}</span>` : `<button class="icon-button card-action" aria-label="More">${icons.more}</button>`}</span>
          </div>
          <div class="bookmark-copy"><strong>${escapeHtml(bookmark.title)}</strong><small>${escapeHtml(bookmark.url)}</small></div>
          <p class="note">${escapeHtml(bookmark.note)}</p>
          <div class="tags">${bookmark.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </article>`).join("");
      }

      function trashContent() {
        return `<div class="breadcrumbs"><span>Bookmarks ›</span><b>Trash</b></div>
          <div class="content-heading"><div><p class="eyebrow">30-day retention</p><h1>Trash</h1><p class="muted" style="margin-top:9px">Deleted items stay here until they expire.</p></div><button class="quiet-button danger-button" data-action="empty-trash">Empty trash</button></div>
          <section class="content-section"><div class="bookmark-grid">${trash.map((item) => `<article class="bookmark-card">
            <div class="bookmark-top"><span class="site-mark">${item.type[0]}</span><span class="tag">${item.type}</span></div>
            <div class="bookmark-copy"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.detail)}</small></div>
            <div class="tags"><button class="quiet-button" data-action="restore">Restore</button><button class="quiet-button danger-button" data-action="permanent-delete">Delete permanently</button></div>
          </article>`).join("")}</div></section>`;
      }

      function folderContent() {
        const folder = currentFolder();
        const childFolders = childrenOf(folder.id);
        const items = bookmarksOf(folder.id);
        const effectiveBookmarks = items.length ? items : folder.id === "engineering" ? bookmarks.slice(0, 5) : [];
        return `<div class="breadcrumbs">${breadcrumb()}</div>
          <div class="content-heading"><div><p class="eyebrow">Current folder</p><h1>${escapeHtml(folder.name)}</h1><p class="muted" style="margin-top:9px">${folder.count} bookmarks · updated this morning</p></div>
          <div class="content-actions"><button class="quiet-button" data-action="new-folder">${icons.folder}<span>New folder</span></button></div></div>
          ${childFolders.length ? `<section class="content-section"><div class="section-label"><h2>Folders</h2><span>${childFolders.length}</span></div><div class="folder-grid">${folderCards(childFolders)}</div></section>` : ""}
          <section class="content-section"><div class="section-label"><h2>Bookmarks</h2><span>${effectiveBookmarks.length}</span></div>
            ${effectiveBookmarks.length ? `<div class="bookmark-grid">${bookmarkCards(effectiveBookmarks)}</div>` : `<div class="empty-state"><span class="folder-icon">${icons.folder}</span><h2>This folder is ready</h2><p>Add the first bookmark, or move one here while editing.</p><button class="primary-button" data-action="new-bookmark">${icons.plus}<span>Add bookmark</span></button></div>`}
          </section>`;
      }

      function mainContent() {
        return `<main class="main"><div class="main-frame">${header()}<div class="edit-ribbon">${icons.grip} Edit Mode · Drag to reorder, select a card to edit</div><div class="content">${state.selectedFolder === "trash" ? trashContent() : folderContent()}</div></div></main>`;
      }

      function searchDialog() {
        const term = state.search.toLowerCase();
        const results = bookmarks.filter((item) => !term || [item.title, item.url, item.note, ...item.tags].join(" ").toLowerCase().includes(term)).slice(0, 5);
        return `<div class="dialog" role="dialog" aria-modal="true" aria-label="Search bookmarks">
          <div class="dialog-body"><input id="search-input" class="search-input" value="${escapeHtml(state.search)}" placeholder="Search titles, URLs, tags, and notes" autocomplete="off" />
          <div class="search-results">${results.map((item) => `<div class="search-result"><span class="site-mark" style="--site:${item.color}">${item.title[0]}</span><span><strong>${escapeHtml(item.title)}</strong><small class="muted">Bookmarks / ${escapeHtml(folderById(item.folder).name)} · ${escapeHtml(item.url)}</small></span><span class="result-type">Bookmark</span></div>`).join("") || `<div class="empty-state"><h2>No results</h2><p>Try a title, URL, Tag, or a word from your Note.</p></div>`}</div></div>
        </div>`;
      }

      function editorDialog(kind = "Bookmark") {
        return `<div class="dialog" role="dialog" aria-modal="true" aria-label="Edit ${kind}">
          <div class="dialog-header"><div><p class="eyebrow">${state.overlay === "edit" ? "Edit" : "Create"}</p><h2>${kind}</h2></div><button class="icon-button" data-action="close-overlay">${icons.close}</button></div>
          <form class="dialog-body" data-action="save-editor">
            ${kind === "Bookmark" ? `<div class="field"><label>URL</label><input value="https://developers.cloudflare.com/" /></div><div class="field"><label>Title</label><input value="Cloudflare Developers" /></div><div class="field"><label>Tags</label><input value="cloudflare, reference" /></div><div class="field"><label>Note</label><textarea>Workers, D1, and platform references.</textarea></div>` : `<div class="field"><label>Name</label><input value="New folder" /></div>`}
            <div class="field"><label>Folder</label><input value="Work / Engineering" /></div>
            <div class="dialog-actions"><button type="button" class="quiet-button" data-action="close-overlay">Cancel</button><button class="primary-button" type="submit">Save</button></div>
          </form>
        </div>`;
      }

      function overlays() {
        let dialog = "";
        if (state.overlay === "search") dialog = searchDialog();
        if (["edit", "new-bookmark"].includes(state.overlay)) dialog = editorDialog("Bookmark");
        if (state.overlay === "new-folder") dialog = editorDialog("Folder");
        return `<div class="overlay ${state.overlay ? "open" : ""}" data-action="overlay-backdrop">${dialog}</div>`;
      }

      function switcher() {
        const meta = variants[state.variant];
        return `<div class="prototype-switcher" aria-label="Prototype variants"><button class="variant-button" data-action="previous-variant" aria-label="Previous variant">←</button><div class="variant-label">${state.variant} — ${meta.name}</div><button class="variant-button" data-action="next-variant" aria-label="Next variant">→</button></div>`;
      }

      function statePanel() {
        const visibleState = { variant: state.variant, selectedFolder: state.selectedFolder, mode: state.mode, overlay: state.overlay, mobileDrawer: state.drawerOpen, persistence: "memory only" };
        return `<details class="state-panel"><summary>Prototype state</summary><pre>${escapeHtml(JSON.stringify(visibleState, null, 2))}</pre></details>`;
      }

      function render(options = {}) {
        const root = document.querySelector("#root");
        const variant = variants[state.variant];
        root.innerHTML = `<div class="prototype-shell"><div class="app ${variant.className} ${state.mode === "edit" ? "edit-mode" : ""} ${state.drawerOpen ? "drawer-open" : ""}">${sidebar()}<button class="drawer-scrim" data-action="toggle-drawer" aria-label="Close folders"></button>${mainContent()}</div>${overlays()}<div class="toast ${state.toast ? "show" : ""}"><span>${escapeHtml(state.toast || "")}</span><button data-action="undo">Undo</button></div>${statePanel()}${switcher()}</div>`;
        if (state.overlay === "search") {
          const input = document.querySelector("#search-input");
          if (input && options.focusSearch !== false) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        }
      }

      function setVariant(direction) {
        const keys = Object.keys(variants);
        const index = keys.indexOf(state.variant);
        state.variant = keys[(index + direction + keys.length) % keys.length];
        const next = new URL(location.href);
        next.searchParams.set("variant", state.variant);
        history.replaceState({}, "", next);
        render();
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "previous-variant") return setVariant(-1);
        if (action === "next-variant") return setVariant(1);
        if (action === "toggle-edit") { state.mode = state.mode === "edit" ? "browse" : "edit"; return render(); }
        if (action === "toggle-drawer") { state.drawerOpen = !state.drawerOpen; return render(); }
        if (action === "select-folder") { state.selectedFolder = target.dataset.id; state.drawerOpen = false; return render(); }
        if (action === "select-trash") { state.selectedFolder = "trash"; state.drawerOpen = false; return render(); }
        if (action === "open-search") { state.overlay = "search"; return render(); }
        if (action === "new-bookmark") { state.overlay = "new-bookmark"; return render(); }
        if (action === "new-folder") { state.overlay = "new-folder"; return render(); }
        if (action === "edit-bookmark") { state.overlay = "edit"; return render(); }
        if (action === "close-overlay" || (action === "overlay-backdrop" && event.target === target)) { state.overlay = null; state.search = ""; return render(); }
        if (action === "open-bookmark") { state.toast = "Prototype: bookmark would open in this tab"; return render(); }
        if (["empty-trash", "restore", "permanent-delete"].includes(action)) { state.toast = action === "restore" ? "Item restored" : action === "empty-trash" ? "Trash emptied" : "Item permanently deleted"; return render(); }
        if (action === "undo") { state.toast = null; return render(); }
      });

      document.addEventListener("submit", (event) => {
        if (!event.target.matches('[data-action="save-editor"]')) return;
        event.preventDefault();
        state.overlay = null;
        state.toast = "Changes saved to prototype memory";
        render();
      });

      document.addEventListener("input", (event) => {
        if (event.target.id !== "search-input") return;
        state.search = event.target.value;
        render({ focusSearch: false });
        const input = document.querySelector("#search-input");
        input.focus(); input.setSelectionRange(state.search.length, state.search.length);
      });

      document.addEventListener("keydown", (event) => {
        const editing = event.target.matches("input, textarea, [contenteditable]");
        if (event.key === "Escape" && state.overlay) { state.overlay = null; state.search = ""; return render(); }
        if ((event.key === "/" && !editing) || ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k")) { event.preventDefault(); state.overlay = "search"; return render(); }
        if (editing) return;
        if (event.key === "ArrowLeft") setVariant(-1);
        if (event.key === "ArrowRight") setVariant(1);
      });

      addEventListener("popstate", () => {
        const variant = new URLSearchParams(location.search).get("variant");
        if (variants[variant]) { state.variant = variant; render(); }
      });
      addEventListener("resize", () => { if (!isMobile() && state.drawerOpen) { state.drawerOpen = false; render(); } });

      render();
    </script>
  </body>
</html>
